name: Cleanup Artifact Registry

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Clean up old artifacts except current tfvars image
        shell: bash
        run: |
          IFS=$'\n\t'

          # 1) Read the full image:tag strings you want to keep into an array.
          mapfile -t IMAGES_TO_KEEP < <(
            grep '^cloud_run_job_image__' infra/tf/terraform.tfvars \
              | sed -E 's/.*=\s*"([^"]+)".*/\1/'
          )

          # 2) Pull out the IMAGE_RESOURCE (repo path/name) from the first one:
          #    “europe-west2-docker.pkg.dev/.../generate_reddit_story_videos”
          IMAGE_RESOURCE="${IMAGES_TO_KEEP[0]%:*}"

          echo "Target repo: $IMAGE_RESOURCE"
          echo "Keeping images:"
          printf "  %s\n" "${IMAGES_TO_KEEP[@]}"

          # 3) Build an associative array of the tags you want to keep:
          declare -A KEEP
          for FULLIMG in "${IMAGES_TO_KEEP[@]}"; do
            # tag is everything after the last colon
            TAG="${FULLIMG##*:}"
            KEEP["$TAG"]=1
          done

          # 4) List *all* tags in the repo, strip to just the short tag name,
          #    and delete those not in your KEEP map.
          gcloud artifacts docker tags list "$IMAGE_RESOURCE" \
            --format="get(tag)" \
          | tr ',' '\n' \
          | while IFS= read -r RAW; do
              # strip out any resource-path cruft → just the tag
              TAG="${RAW##*/}"
              FULL="$IMAGE_RESOURCE:$TAG"

              if [[ -n "${KEEP[$TAG]:-}" ]]; then
                echo "keeping $FULL"
              else
                echo "deleting $FULL"
                gcloud artifacts docker images delete "$FULL" --quiet
              fi
            done
