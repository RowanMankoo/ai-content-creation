name: Cleanup Artifact Registry

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Clean up old artifacts except current tfvars image
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'

          # load images to keep
          mapfile -t IMAGES_TO_KEEP < <(
            grep '^cloud_run_job_image__' infra/tf/terraform.tfvars \
              | sed -E 's/.*=\s*"([^"]+)".*/\1/'
          )

          IMAGE_RESOURCE="${IMAGES_TO_KEEP[0]%:*}"

          # build keep map
          declare -A KEEP
          for full in "${IMAGES_TO_KEEP[@]}"; do
            tag="${full##*:}"
            tag="${tag//$'\r'}"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            KEEP["$tag"]=1
          done

          # list all tags
          mapfile -t ALL_TAGS < <(
            gcloud artifacts docker tags list "$IMAGE_RESOURCE" --format="get(tag)" \
            | tr ',' '\n' \
            | sed -e 's!.*/!!' -e 's/\r//g' \
            | awk '{$1=$1};1'
          )

          # separate keep vs delete
          to_delete=()
          for tag in "${ALL_TAGS[@]}"; do
            full="$IMAGE_RESOURCE:$tag"
            if [[ -z "${KEEP[$tag]:-}" ]]; then
              to_delete+=("$full")
            fi
          done

          # delete old tags
          if (( ${#to_delete[@]} )); then
            for img in "${to_delete[@]}"; do
              echo "Deleting $img"
              gcloud artifacts docker images delete "$img" --quiet
            done
            echo "Cleanup complete."
          else
            echo "No images to delete."
          fi
