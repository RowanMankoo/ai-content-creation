name: Build, Tag, and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      changed_folders: ${{ steps.get-changed-folders.outputs.folders }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get list of changed folders
        id: get-changed-folders
        uses: tj-actions/changed-files@v39
        with:
          path: ai_content_creation/cloud_run_jobs
          dir_names: true
          escape_json: false
          json: true
      
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.get-changed-folders.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done


  build_and_push:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.changed_folders != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ${{ fromJson(needs.detect_changes.outputs.changed_folders) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd ai_content_creation/cloud_run_jobs/${{ matrix.folder }}
          docker build -t ai-content-creation/${{ matrix.folder }}:latest .

      - name: Tag Docker Image
        run: |
          cd ai_content_creation/cloud_run_jobs/${{ matrix.folder }}
          docker tag \
          ai-content-creation/${{ matrix.folder }}:latest \
          europe-west2-docker.pkg.dev/ai-content-creation-438122/docker-repository/${{ matrix.folder }}:latest

      - name: Push Docker Image
        run: |
          cd ai_content_creation/cloud_run_jobs/${{ matrix.folder }}
          docker push europe-west2-docker.pkg.dev/ai-content-creation-438122/docker-repository/${{ matrix.folder }}:latest

